<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Elevation Gym Tracker</title>
  <meta name="description" content="Personal gym tracker: log reps, kg and lbs, intensity, see progress per machine and weekly KPI. Data lives in your Google Sheet.">
  <meta name="theme-color" content="#0b0d0e">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1l7 14H1z' fill='%23c6ff00'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <div class="brand"><span class="brand-mark" aria-hidden="true">▲</span> ELEVATION</div>
    <div class="top-actions">
      <button class="chip" id="unitToggle" aria-label="Display unit">kg</button>
      <button class="icon-btn" id="themeToggle" aria-label="Toggle light or dark theme">◐</button>
    </div>
  </header>

  <nav class="nav" aria-label="Main">
    <a href="#log" data-route="log"><span aria-hidden="true">＋</span>Log</a>
    <a href="#favorites" data-route="favorites"><span aria-hidden="true">★</span>Favs</a>
    <a href="#progress" data-route="progress"><span aria-hidden="true">↗</span>Charts</a>
    <a href="#calendar" data-route="calendar"><span aria-hidden="true">▦</span>Calendar</a>
    <a href="#week" data-route="week"><span aria-hidden="true">◆</span>Week</a>
    <a href="#settings" data-route="settings"><span aria-hidden="true">⚙</span>Setup</a>
  </nav>

  <main id="main" tabindex="-1">
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <div id="view"></div>
  </main>

  <dialog id="shareDialog" aria-labelledby="shareTitle">
    <h2 id="shareTitle">Share summary</h2>
    <canvas id="shareCanvas" width="1080" height="1350" aria-label="Workout summary image"></canvas>
    <div class="row">
      <button class="btn" id="shareGo">Share</button>
      <button class="btn ghost" id="shareSave">Save PNG</button>
      <button class="btn ghost" id="shareClose">Close</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
